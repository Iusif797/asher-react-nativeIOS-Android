name: keep-supabase-awake

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ifteitrwaikncwlwinui.supabase.co/rest/v1/directions?select=id&limit=1" \
            -H "apikey: sb_publishable_Iq6vj6BvsSmePJQCIHm7MQ_k0imICnQ")
          echo "Supabase ответил: $code"
          test "$code" = "200"
