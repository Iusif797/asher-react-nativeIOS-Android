<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafcfe" />
    <script>
      (function () {
        var LIGHT = { theme: 'light', browserUi: '#fafcfe' }
        var DARK = { theme: 'dark', browserUi: '#131a24' }
        var applied = LIGHT
        try {
          var stored = window.localStorage.getItem('asher:theme')
          if (stored && JSON.parse(stored).state.theme === 'dark') applied = DARK
        } catch (error) {
          applied = LIGHT
        }
        document.documentElement.dataset.theme = applied.theme
        document.querySelector('meta[name="theme-color"]').content = applied.browserUi
      })()
    </script>
    <meta
      name="description"
      content="ASHER — персональная система психологического благополучия: консультации, дневники, программы и личная дорожная карта изменений."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap"
    />
    <title>ASHER — персональная система психологического благополучия</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
