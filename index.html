<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafcfe" />
    <script>
      (function () {
        var LIGHT = { theme: 'light', browserUi: '#fafcfe' }
        var DARK = { theme: 'dark', browserUi: '#131a24' }
        var applied = LIGHT
        try {
          var stored = window.localStorage.getItem('asher:theme')
          if (stored && JSON.parse(stored).state.theme === 'dark') applied = DARK
        } catch (error) {
          applied = LIGHT
        }
        document.documentElement.dataset.theme = applied.theme
        document.querySelector('meta[name="theme-color"]').content = applied.browserUi
      })()
    </script>
    <meta
      name="description"
      content="ASHER — персональная система психологического благополучия: консультации, дневники, программы и личная дорожная карта изменений."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>ASHER — персональная система психологического благополучия</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/splash-logo.png" alt="" width="300" />
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: #fafcfe;
        opacity: 1;
        transition: opacity 0.5s ease 0.15s;
      }
      [data-theme='dark'] #splash {
        background: #131a24;
      }
      #splash img {
        width: min(62vw, 320px);
        height: auto;
        animation:
          splash-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
          splash-breathe 1.6s ease-in-out 0.7s infinite alternate;
      }
      [data-theme='dark'] #splash img {
        filter: invert(1);
      }
      #splash.splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-in {
        from {
          transform: scale(0.88);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes splash-breathe {
        from {
          transform: scale(1);
          opacity: 0.94;
        }
        to {
          transform: scale(1.035);
          opacity: 1;
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
